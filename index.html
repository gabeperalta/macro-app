<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macro Bot</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Macro Bot">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>Macro Bot</h1><button id="logout" class="link hidden">Log out</button></header>

<section id="auth" class="card hidden">
  <h2>Sign in</h2>
  <input id="username" placeholder="Username" autocapitalize="none" autocomplete="username">
  <input id="password" type="password" placeholder="Password (min 6 chars)" autocomplete="current-password">
  <div class="row"><button id="login">Log in</button><button id="signup" class="secondary">Create account</button></div>
  <p id="authMsg" class="msg"></p>
</section>

<section id="pending" class="card hidden">
  <h2>Waiting for approval</h2>
  <p class="msg">Your account was created and is waiting for the owner to approve it. Check back soon.</p>
  <div class="row"><button id="pendingRefresh">Refresh</button><button id="pendingLogout" class="secondary">Log out</button></div>
  <p id="pendingMsg" class="msg"></p>
</section>

<main id="app" class="hidden">
  <section class="card">
    <h2>Last Week</h2>
    <div class="chartwrap"><canvas id="chart"></canvas></div>
  </section>
  <section>
    <h2 class="pad">Today</h2>
    <div class="panels">
      <div class="panel protein"><span>Protein</span><b id="tP">0g</b></div>
      <div class="panel carbs"><span>Carbs</span><b id="tC">0g</b></div>
      <div class="panel fat"><span>Fats</span><b id="tF">0g</b></div>
    </div>
  </section>
  <section class="card">
    <h2>Log food</h2>
    <div id="chat" class="chat"></div>
    <div id="review" class="hidden">
      <table><thead><tr><th>Item</th><th>P</th><th>C</th><th>F</th><th></th></tr></thead><tbody id="reviewBody"></tbody></table>
      <div class="row"><button id="save">Save</button><button id="cancel" class="secondary">Cancel</button></div>
    </div>
    <form id="chatForm" class="row">
      <input id="chatInput" placeholder="e.g. 1 serving Kodiak pancakes, 3 eggs" autocomplete="off">
      <button type="button" id="mic" class="mic hidden" aria-label="Speak your meal" title="Speak your meal">🎤</button>
      <button id="send">Send</button>
    </form>
  </section>
  <section class="card">
    <h2>Today's items</h2>
    <ul id="todayList" class="list"></ul>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
